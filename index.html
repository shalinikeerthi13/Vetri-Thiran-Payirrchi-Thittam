```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenie</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        p {
            text-align: center;
            color: #666;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            font-size: 16px;
        }

        button {
            display: block;
            margin: 15px auto;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            background: #3498db;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        #answer {
            margin-top: 20px;
            padding: 15px;
            background: #f1f8ff;
            border-radius: 8px;
            min-height: 50px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎓 EduGenie</h1>

    <p>Ask a question and get an answer from your learning assistant.</p>

    <textarea id="question" placeholder="Type your question here..."></textarea>

    <button onclick="askQuestion()">Ask EduGenie</button>

    <div id="answer">
        Your answer will appear here.
    </div>

</div>

<script>
async function askQuestion() {

    const question = document.getElementById("question").value;
    const answerBox = document.getElementById("answer");

    if (!question.trim()) {
        answerBox.innerText = "Please enter a question.";
        return;
    }

    answerBox.innerText = "Thinking...";

    try {

        const response = await fetch("/qa", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                text: question
            })
        });

        const data = await response.json();

        if (!response.ok) {
            answerBox.innerText = data.detail || "Something went wrong.";
            return;
        }

        answerBox.innerText =
            data.answer || data.result || JSON.stringify(data);

    } catch (error) {

        answerBox.innerText =
            "Could not connect to the EduGenie server.";

        console.error(error);
    }
}
</script>

</body>
</html>
